<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting | Fernhollow Goods (demo store)</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- RETIRED: each product now has its own page, products/<SKU>.html, which is the one canonical
       URL per product. This page only forwards old product.html?id=<SKU> links (bookmarks, old
       feed uploads, ads) there. It deliberately has NO Pixel code: if it fired PageView, the
       pixel-based catalog would see a second URL for the same product. -->
  <script src="data/products.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      params.delete("id"); // keep everything else, e.g. ?fbclid=... for the _fbc cookie
      var rest = params.toString() ? "?" + params.toString() : "";
      var known = (window.PRODUCTS || []).some(function (p) { return p.id === id; });
      window.location.replace(known ? "products/" + encodeURIComponent(id) + ".html" + rest : "index.html" + rest);
    })();
  </script>
</head>
<body>
  <div class="demo-banner">DEMO STORE — TEST ONLY — NOT A REAL BUSINESS, NO REAL PAYMENTS ACCEPTED</div>
  <main>
    <p>This page has moved. <a href="index.html">See all products</a>.</p>
  </main>
</body>
</html>
